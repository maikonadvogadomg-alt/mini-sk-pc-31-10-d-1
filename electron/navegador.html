<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; img-src * data:">
<title>🌐 Navegador — Mini SK</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1420; color: #e8eaf0; font: 15px system-ui, 'Segoe UI', sans-serif; overflow: hidden; }
  .barra { display: flex; gap: 4px; align-items: center; padding: 6px; background: #151b2b; border-bottom: 1px solid #263048; }
  button { background: transparent; color: #e8eaf0; border: 0; border-radius: 8px; font-size: 18px; padding: 4px 10px; cursor: pointer; }
  button:hover { background: #1b2337; }
  button:disabled { opacity: .35; }
  input { flex: 1; min-width: 0; background: #1b2337; color: #e8eaf0; border: 1px solid #263048; border-radius: 8px; padding: 8px 10px; font: inherit; }
  .carregando { height: 2px; background: #3fa36b; width: 0; transition: width .3s; }
  webview { position: absolute; top: 50px; left: 0; right: 0; bottom: 0; }
  #recentes { position: absolute; top: 48px; left: 140px; right: 60px; background: #151b2b; border: 1px solid #263048; border-radius: 8px; max-height: 60vh; overflow: auto; z-index: 9; display: none; }
  #recentes div { padding: 8px 10px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  #recentes div:hover { background: #1b2337; }
</style>
</head>
<body>
<div class="barra">
  <button id="voltar" title="Voltar">◀</button>
  <button id="frente" title="Avançar">▶</button>
  <button id="recarregar" title="Recarregar">↻</button>
  <input id="end" placeholder="Endereço ou pesquisa (Enter)" spellcheck="false" autocomplete="off">
  <button id="fora" title="Abrir no navegador do Windows">↗</button>
</div>
<div class="carregando" id="carregando"></div>
<div id="recentes"></div>
<webview id="w" partition="persist:navegador" allowpopups src="about:blank"></webview>
<script>
(function () {
  var w = document.getElementById('w'), end = document.getElementById('end'), rec = document.getElementById('recentes'), carr = document.getElementById('carregando');
  function historico() { try { return JSON.parse(localStorage.getItem('historico') || '[]'); } catch (e) { return []; } }
  function guardar(u) { if (!/^https?:/.test(u)) return; try { var h = historico().filter(function (x) { return x !== u; }); h.unshift(u); localStorage.setItem('historico', JSON.stringify(h.slice(0, 40))); localStorage.setItem('ultimo', u); } catch (e) {} }
  function arrumar(t) {
    t = (t || '').trim();
    if (!t) return 'https://duckduckgo.com/';
    if (/^https?:\/\//i.test(t)) return t;
    if (!/\s/.test(t) && /\./.test(t)) return 'https://' + t;
    return 'https://duckduckgo.com/?kl=br-pt&q=' + encodeURIComponent(t);
  }
  function ir(t) { rec.style.display = 'none'; w.loadURL(arrumar(t)).catch(function () {}); }
  function botoes() { try { document.getElementById('voltar').disabled = !w.canGoBack(); document.getElementById('frente').disabled = !w.canGoForward(); } catch (e) {} }
  window.irPara = function (u) { ir(u || localStorage.getItem('ultimo') || ''); };
  document.getElementById('voltar').onclick = function () { if (w.canGoBack()) w.goBack(); };
  document.getElementById('frente').onclick = function () { if (w.canGoForward()) w.goForward(); };
  document.getElementById('recarregar').onclick = function () { w.reload(); };
  document.getElementById('fora').onclick = function () { if (window.navegadorPC) window.navegadorPC.fora(w.getURL()); };
  end.addEventListener('keydown', function (e) { if (e.key === 'Enter') { ir(end.value); end.blur(); } if (e.key === 'Escape') rec.style.display = 'none'; });
  end.addEventListener('focus', function () {
    end.select();
    var h = historico(); if (!h.length) return;
    rec.innerHTML = ''; h.slice(0, 15).forEach(function (u) { var d = document.createElement('div'); d.textContent = u; d.onmousedown = function () { ir(u); }; rec.appendChild(d); });
    rec.style.display = 'block';
  });
  end.addEventListener('blur', function () { setTimeout(function () { rec.style.display = 'none'; }, 150); });
  w.addEventListener('did-start-loading', function () { carr.style.width = '60%'; });
  w.addEventListener('did-stop-loading', function () { carr.style.width = '100%'; setTimeout(function () { carr.style.width = '0'; }, 300); botoes(); });
  w.addEventListener('did-navigate', function (e) { if (document.activeElement !== end) end.value = e.url; guardar(e.url); botoes(); });
  w.addEventListener('did-navigate-in-page', function (e) { if (e.isMainFrame && document.activeElement !== end) end.value = e.url; botoes(); });
  w.addEventListener('page-title-updated', function (e) { document.title = '🌐 ' + e.title; });
  document.addEventListener('keydown', function (e) { if (e.altKey && e.key === 'ArrowLeft' && w.canGoBack()) w.goBack(); if (e.altKey && e.key === 'ArrowRight' && w.canGoForward()) w.goForward(); if (e.key === 'F5') w.reload(); if (e.ctrlKey && e.key === 'l') end.focus(); });
})();
</script>
</body>
</html>
